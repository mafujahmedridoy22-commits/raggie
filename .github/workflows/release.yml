name: Release

# On a v* tag: build multi-arch images, push them to GHCR, scan, sign (cosign
# keyless), attach an SBOM and SLSA build provenance, then publish the GitHub
# Release with notes from CHANGELOG.md and the installer + its checksum.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The release gate (scripts/release-preflight.sh) on the tag checkout: a
  # clean tree whose HEAD is the tag, changelog section, i18n, config docs,
  # SPDX, notices review, forbidden strings and paths, image pins, installer.
  # gitleaks runs in CI (it WARNs here when not installed). Nothing builds
  # until it passes.
  preflight:
    name: release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: scripts/release-preflight.sh
        env:
          RELEASE_PREFLIGHT_REQUIRE_TAG: "1"
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/release-preflight.sh "$version"

  # THIRD_PARTY_NOTICES.md regenerated on Linux, so the platform-specific
  # optional packages (e.g. @img/sharp-libvips-linuxmusl-x64) match the images.
  # Fails the release on any "Review required" entry (copyleft, non-commercial,
  # unknown license) that scripts/notices/review-allowlist.txt does not approve.
  notices:
    name: third-party notices
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: install web production dependencies (Linux optional packages)
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: notices tooling self-test
        run: uv run --no-project --with "pytest==9.0.3" pytest -q -p no:cacheprovider scripts/notices
      - name: regenerate THIRD_PARTY_NOTICES.md
        run: make notices
      - name: license review gate
        run: python3 scripts/notices/check_review.py
      # Copied into every image at /licenses/ and attached to the release.
      - name: license bundle
        run: |
          mkdir -p "$RUNNER_TEMP/licenses"
          cp THIRD_PARTY_NOTICES.md LICENSE NOTICE licenses/LGPL-3.0.txt licenses/GPL-3.0.txt \
            "$RUNNER_TEMP/licenses/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licenses
          path: ${{ runner.temp }}/licenses/
          if-no-files-found: error

  images:
    name: image ${{ matrix.name }}
    needs: notices
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless + provenance signing (Sigstore OIDC)
      attestations: write # actions/attest-build-provenance
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: edge
            image: raggie-edge
            context: services/edge
            file: services/edge/Dockerfile
          - name: mockllm
            image: raggie-mockllm
            context: services/edge
            file: services/edge/Dockerfile.mockllm
          - name: control-plane
            image: raggie-control-plane
            context: services/control-plane
            file: services/control-plane/Dockerfile
          - name: workers
            image: raggie-workers
            context: services/workers
            file: services/workers/Dockerfile
          - name: embeddings-local
            image: raggie-embeddings
            context: services/embeddings
            file: services/embeddings/Dockerfile
            suffix: -local
            build-args: EMBEDDINGS_BAKE=dense,sparse,rerank
          - name: embeddings-slim
            image: raggie-embeddings
            context: services/embeddings
            file: services/embeddings/Dockerfile
            suffix: -slim
            build-args: EMBEDDINGS_BAKE=sparse
          - name: web
            image: raggie-web
            context: web
            file: web/Dockerfile
    env:
      # Put the OCI annotations on both the per-platform manifests and the index.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: image name
        id: name
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licenses
          path: ${{ runner.temp }}/licenses
      # The service Dockerfile plus one release-only line: the license texts go
      # to /licenses/ in the final stage, from a named build context. The
      # Dockerfiles in the repo (and dev/compose builds) stay unchanged.
      - name: release Dockerfile
        env:
          DOCKERFILE: ${{ matrix.file }}
        run: |
          cp "$DOCKERFILE" "$RUNNER_TEMP/Dockerfile.release"
          printf '\n# Release build only (.github/workflows/release.yml).\nCOPY --from=licenses / /licenses/\n' \
            >> "$RUNNER_TEMP/Dockerfile.release"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.ref }}
          # 1.2.3, v1.2.3 and 1.2; pre-releases get only the exact versions and
          # never `latest`. Embeddings variants carry their suffix everywhere.
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
            suffix=${{ matrix.suffix }},onlatest=true
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=${{ matrix.image }}
          annotations: |
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=${{ matrix.image }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ runner.temp }}/Dockerfile.release
          build-contexts: licenses=${{ runner.temp }}/licenses
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.build-args }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Provenance and SBOM are produced below as signed attestations.
          provenance: false
          sbom: false
      # Gate before signing: an image that fails the scan stays unsigned and the
      # release job (which needs every image) never runs.
      - name: trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.ref }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: cosign sign (keyless)
        env:
          IMAGE_REF: ${{ steps.name.outputs.ref }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"
      - name: SBOM (syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.name.outputs.ref }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-${{ matrix.name }}.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: ${{ runner.temp }}/sbom-${{ matrix.name }}.spdx.json
          if-no-files-found: error
      - name: cosign attest SBOM
        env:
          IMAGE_REF: ${{ steps.name.outputs.ref }}@${{ steps.build.outputs.digest }}
          SBOM: ${{ runner.temp }}/sbom-${{ matrix.name }}.spdx.json
        run: cosign attest --yes --type spdxjson --predicate "$SBOM" "$IMAGE_REF"
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
      id-token: write # provenance for the installer
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # The section of this version: from its "## [1.2.3]" / "## v1.2.3"
          # heading up to the next "## " heading.
          awk -v v="$version" '
            /^## / {
              if (found) exit
              h = $0
              sub(/^## +\[?v?/, "", h)
              if (index(h, v) == 1 && substr(h, length(v) + 1, 1) ~ /^(\]| |$)/) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cat >> "$RUNNER_TEMP/notes.md" <<EOF

          ## Verify

          Images: \`ghcr.io/${owner}/raggie-{edge,control-plane,workers,web,mockllm}:${version}\`
          and \`ghcr.io/${owner}/raggie-embeddings:${version}-{local,slim}\` (linux/amd64, linux/arm64).

          \`\`\`bash
          cosign verify ghcr.io/${owner}/raggie-edge:${version} \\
            --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://ghcr.io/${owner}/raggie-edge:${version} --repo ${GITHUB_REPOSITORY}
          sha256sum -c --ignore-missing SHA256SUMS
          \`\`\`
          EOF
      - name: installer, source bundle and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Pin the installer to this release; it downloads and verifies the
          # matching source bundle against SHA256SUMS.
          cp web/public/install.sh "$RUNNER_TEMP/install.sh"
          sed -i "s/^RAGGIE_DEFAULT_VERSION=.*/RAGGIE_DEFAULT_VERSION=\"${version}\"/" "$RUNNER_TEMP/install.sh"
          grep -qx "RAGGIE_DEFAULT_VERSION=\"${version}\"" "$RUNNER_TEMP/install.sh" \
            || { echo "::error::could not pin RAGGIE_DEFAULT_VERSION in install.sh"; exit 1; }
          git archive --format=tar.gz --prefix="raggie-${version}/" \
            -o "$RUNNER_TEMP/raggie-${version}.tar.gz" HEAD
          (cd "$RUNNER_TEMP" \
            && sha256sum install.sh "raggie-${version}.tar.gz" > SHA256SUMS \
            && sha256sum install.sh > install.sh.sha256)
      - name: installer and bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/install.sh
            ${{ runner.temp }}/raggie-*.tar.gz
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: ${{ runner.temp }}/sbom
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licenses
          path: ${{ runner.temp }}/licenses
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}" \
            "$RUNNER_TEMP/install.sh" "$RUNNER_TEMP/install.sh.sha256" \
            "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP"/raggie-*.tar.gz \
            "$RUNNER_TEMP"/sbom/*.spdx.json \
            "$RUNNER_TEMP/licenses/THIRD_PARTY_NOTICES.md" \
            "$RUNNER_TEMP/licenses/LGPL-3.0.txt" "$RUNNER_TEMP/licenses/GPL-3.0.txt"
